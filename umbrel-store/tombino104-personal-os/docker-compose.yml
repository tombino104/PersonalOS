version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tombino104/personalos:0.10.0@sha256:cee1d1fb488c1bde9b810085c227285016ebe8d0bd099cb77f1d0b5cb17e1066
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
