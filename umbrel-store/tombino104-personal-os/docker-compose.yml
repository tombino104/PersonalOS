version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tombino104/personalos:0.8.0@sha256:4e7ead1ccae6af5eca670a53e2b8fa542664ceecd2a73daadfcf5c79621b8734
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
