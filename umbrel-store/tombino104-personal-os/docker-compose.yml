version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/personalos:0.20.0@sha256:874d5e9d366d40026564f774d01d0412c1910dfb79345fca8c4d621968b76c23
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      SETUP_CODE_REQUIRED: "false"
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
