version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tombino104/personalos:0.10.1@sha256:d22500ff32c5b96625672b1fe5bfaf908dee5c466a93bdf4aa90a2361340678c
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
