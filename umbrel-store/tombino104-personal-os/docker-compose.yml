version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tombino104/personalos:0.9.1@sha256:7e22b0716a89ba9e30c5bae3948d2912ead8c2a21d1caeb31c826cb7a4243b8f
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
