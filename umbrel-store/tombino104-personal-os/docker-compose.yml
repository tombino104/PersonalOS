version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-personal-os_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/personalos:0.26.0@sha256:35fbbc7d70582bdb6a08b3da2230824d6de2814ec1fc8738e28d68fa23d1194a
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      SETUP_CODE_REQUIRED: "false"
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
