version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: personal-os_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/personalos:0.13.0@sha256:2052cbd9856a72814ebe0688fe30605ef70c6432cacdda1a841fd03e965923d8
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      SETUP_CODE_REQUIRED: "false"
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
