version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: personal-os_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/personalos:0.17.0@sha256:e1f0a60a1ca9c2eaf77daead6ff2a7f1f891298f660945b73240cb518d6c1b74
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      SETUP_CODE_REQUIRED: "false"
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
