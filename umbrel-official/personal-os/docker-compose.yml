version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: personal-os_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/personalos:0.15.0@sha256:e977e2cdf1e37943f1ffefe07c7ab8f559bd26c86712992e0ee5de110322ffa8
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: auto
      SETUP_CODE_REQUIRED: "false"
      ENABLE_DOCS: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
