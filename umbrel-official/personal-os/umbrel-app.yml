manifestVersion: 1
id: personal-os
category: productivity
name: Personal OS
version: "0.11.0"
tagline: A quiet place for your days
description: >-
  A personal growth system for one person: six life areas, a relative score and an evening questionnaire.
  It is a mirror, not a judge: it measures behaviors, never results, and a day left blank is empty, not zero.


  Everything you write stays in one folder on your Umbrel, so a backup is just a copy of that folder, and the app
  makes nightly backups for you. Extra features (a built-in calendar, a mood tracker, a daily quote) are plugins you
  can turn on and off.
