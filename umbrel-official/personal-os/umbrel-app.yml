manifestVersion: 1
id: personal-os
category: productivity
name: Personal OS
version: "0.25.0"
tagline: Discipline, without the dopamine tricks
description: >-
  A free, self-hosted daily check-in for six areas of your life: physical, discipline, social, intellect, career and
  mindset. No streaks, no points, no subscription, no cloud. It is a mirror, not a judge: it measures behaviors,
  never results, and a day left blank is empty, not zero.


  Everything you write stays in one folder on your Umbrel, so a backup is just a copy of that folder, and the app
  makes daily backups for you. Extra features (a built-in calendar, a mood tracker, a daily quote) are plugins you
  can turn on and off.
developer: tombino104
