services:
  personal-os:
    build: .
    image: personal-os:dev
    container_name: personal-os
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-47213}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
    volumes:
      - ./data:/data
