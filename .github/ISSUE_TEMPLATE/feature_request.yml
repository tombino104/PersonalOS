name: Idea or feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Personal OS is a mirror, not a judge. Please read CONTRIBUTING.md first; ideas that rank, reward or pressure the user are unlikely to fit.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Could it be a plugin?
